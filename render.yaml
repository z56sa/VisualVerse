services:
  - type: web
    name: visualverse-bot
    env: node
    plan: free
    buildCommand: npm install && node src/deploy-commands.js
    startCommand: node src/index.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: PORT
        value: 10000
