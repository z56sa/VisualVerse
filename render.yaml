# ════════════════════════════════════════════════════
# VisualVerse — Render Deployment Configuration
# ════════════════════════════════════════════════════
services:
  - type: web
    name: visualverse
    env: node
    region: frankfurt       # أقرب منطقة للمنطقة العربية
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000         # Render يستخدم 10000 افتراضياً
    healthCheckPath: /api/stats
    autoDeploy: true
